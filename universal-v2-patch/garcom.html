<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garçom | Cardápio Universal</title><link rel="stylesheet" href="garcom.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script></head><body>
<div class="g-shell"><section id="loginCard" class="g-card g-login"><h1>Acesso do garçom</h1><p class="g-note">Entre no estabelecimento correto. O acesso é isolado por loja.</p><form class="g-form" id="loginForm"><input id="loginStore" placeholder="Loja (slug)" required><input id="loginUser" placeholder="Nome do garçom ou e-mail" required><input id="loginPassword" type="password" placeholder="Senha" required><button class="g-primary">Entrar</button><div id="loginStatus" class="g-status"></div></form></section>
<main id="app" class="hidden"><header class="g-head"><div><small id="storeLabel">Loja</small><h1>Atendimento por mesa</h1></div><button id="logout" class="g-secondary">Sair</button></header><section class="g-card"><div class="g-row"><div><strong>Escolha a mesa</strong><div class="g-note">Mesas com comanda aberta aparecem destacadas.</div></div><button class="g-secondary" onclick="loadTables()">↻</button></div><div id="tables" class="g-grid" style="margin-top:12px"></div></section><section id="orderCard" class="g-card hidden"><div class="g-row"><div><strong id="tableTitle">Mesa</strong><div class="g-note">Adicione os itens solicitados pelo cliente.</div></div><button class="g-secondary" onclick="closeTable()">Trocar mesa</button></div><div id="cats" class="g-cats" style="margin-top:14px"></div><div id="products" class="g-products"></div></section><section id="cartCard" class="g-card hidden"><div class="g-row"><strong>Pedido da mesa</strong><strong id="cartTotal" class="g-total">R$ 0,00</strong></div><div id="cart"></div><textarea id="notes" rows="3" placeholder="Observações do pedido"></textarea><button class="g-primary" style="width:100%;margin-top:12px" onclick="sendOrder()">Enviar pedido para a cozinha</button><div id="orderStatus" class="g-status"></div></section></main></div><script src="garcom.js"></script></body></html>
